<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Obsidian Gradient -->
    <radialGradient id="pm-canvas" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="45%" stop-color="#080a10"/>
      <stop offset="100%" stop-color="#030407"/>
    </radialGradient>

    <!-- Liquid Gold Gradients -->
    <linearGradient id="pm-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8a2"/>
      <stop offset="35%" stop-color="#dfb15b"/>
      <stop offset="70%" stop-color="#b68934"/>
      <stop offset="100%" stop-color="#fae08f"/>
    </linearGradient>

    <linearGradient id="pm-gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="100%" stop-color="#d4a347"/>
    </linearGradient>

    <!-- Platinum Glass Rim -->
    <linearGradient id="pm-glass-rim" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.65)"/>
      <stop offset="30%" stop-color="rgba(250, 232, 162, 0.35)"/>
      <stop offset="70%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(212, 163, 71, 0.3)"/>
    </linearGradient>

    <!-- Subtle Ambient Gold Glow -->
    <radialGradient id="pm-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(223, 177, 91, 0.28)"/>
      <stop offset="60%" stop-color="rgba(223, 177, 91, 0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Filter for soft liquid glass sheen -->
    <filter id="pm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Squircle Body -->
  <rect width="512" height="512" rx="120" fill="url(#pm-canvas)"/>
  <rect width="510" height="510" x="1" y="1" rx="119" fill="none" stroke="url(#pm-glass-rim)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Ambient Light Reflection inside glass -->
  <circle cx="256" cy="256" r="180" fill="url(#pm-core-glow)"/>

  <!-- Outer Precision Memory Orbital Rings -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#pm-glass-rim)" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="url(#pm-gold-grad)" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Glass Prism Ring with specular bevel -->
  <circle cx="256" cy="256" r="124" fill="rgba(12, 16, 25, 0.65)" stroke="url(#pm-glass-rim)" stroke-width="6"/>

  <!-- Iconic Monogram "P" + Infinite Memory Helix -->
  <!-- Vertical Obsidian & Gold Stem -->
  <rect x="200" y="152" width="26" height="208" rx="13" fill="url(#pm-gold-grad)"/>
  <rect x="202" y="154" width="8" height="204" rx="4" fill="url(#pm-gold-light)" opacity="0.8"/>

  <!-- The Upper Architectural P Loop (Liquid Gold Arc) -->
  <path d="M 213 152
           H 286
           C 334 152, 366 182, 366 226
           C 366 270, 334 300, 286 300
           H 213
           Z"
        fill="none"
        stroke="url(#pm-gold-grad)"
        stroke-width="26"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Inner Bevel Reflection on the P Loop -->
  <path d="M 220 162
           H 284
           C 324 162, 352 186, 352 226
           C 352 266, 324 290, 284 290
           H 220"
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        stroke-opacity="0.65"
        stroke-linecap="round"/>

  <!-- Central Dynamic Focus Diamond / Memory Crystal -->
  <polygon points="280,204 302,226 280,248 258,226" fill="url(#pm-gold-light)" filter="url(#pm-glow)"/>
  <polygon points="280,208 298,226 280,244 262,226" fill="#080a10"/>
  <circle cx="280" cy="226" r="4.5" fill="#fae8a2"/>

  <!-- Bottom Forward Catalyst Chevron -->
  <path d="M 246 322 L 276 352 L 306 322"
        fill="none"
        stroke="url(#pm-gold-grad)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
